<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Tallkidd C64 Desk</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root { --screen-text: #a8c8ff; --screen-text-dim: #7898c8; --key-active: rgba(255,255,255,.22); }
    body { margin:0; background:#000; display:grid; place-items:center; min-height:100vh; font-family:"Courier New",monospace; }
    .desk-scene { position:relative; width:min(95vw,1200px); aspect-ratio:1; background:url("c64-desk-scene-v6.png") center/cover no-repeat; border-radius:12px; box-shadow:0 20px 60px rgba(0,0,0,.8); user-select:none; }
    .c64-screen-overlay { position:absolute; left:28%; top:28%; width:18%; height:13%; color:var(--screen-text); text-shadow:0 0 4px rgba(168,200,255,.6); padding:1.2% 1.5%; font-size:clamp(10px,1.35vw,15px); line-height:1.35; white-space:pre-wrap; word-break:break-word; overflow:hidden; cursor:text; }
    .c64-keyboard-overlay { position:absolute; left:22%; top:58%; width:56%; height:22%; display:grid; grid-template-rows:repeat(4,1fr); gap:1.5%; padding:1.5%; pointer-events:none; }
    .key-row { display:grid; grid-template-columns:repeat(15,1fr); gap:1.5%; }
    .key { border-radius:4%; background:transparent; transition:background 60ms ease; }
    .key.pressed { background:var(--key-active); }
    @media (max-width:700px) { .c64-keyboard-overlay { display:none; } }
  </style>
</head>
<body>
  <main class="desk-scene" aria-label="Tallkidd Commodore 64 desk">
    <div class="c64-screen-overlay" id="screenOverlay" role="status" aria-live="polite"></div>
    <div class="c64-keyboard-overlay" id="keyboardOverlay" aria-hidden="true"></div>
  </main>
  <script>
    const screenOverlay=document.getElementById("screenOverlay");
    const keyboardOverlay=document.getElementById("keyboardOverlay");
    const PROJECTS={PAREIDOLIA:"https://pareidolia.tallkidd.com",JESSEOS:"https://jesseos.tallkidd.com",CCTV:"https://cctv.tallkidd.com",ARCADE:"#"};
    const bootLines=["","**** COMMODORE 64 BASIC V2 ****","","64K RAM SYSTEM 38911 BASIC BYTES FREE","","READY."];
    let bootIndex=0,screenContent="",inputBuffer="",lastLoaded=null,ready=false;
    function render(){screenOverlay.textContent=screenContent+(ready?inputBuffer+"█":"");}
    function boot(){if(bootIndex>=bootLines.length){ready=true;screenContent+='\nTYPE A PROJECT NAME OR LOAD "NAME",8,1 THEN RUN.\nPAREIDOLIA  JESSEOS  CCTV  ARCADE\n\nREADY.\n';render();return;}screenContent+=bootLines[bootIndex++]+"\n";render();setTimeout(boot,220);}
    function command(){const raw=inputBuffer,cmd=raw.trim().toUpperCase();screenContent+=raw+"\n";inputBuffer="";if(!cmd){screenContent+="READY.\n";}else if(cmd==="RUN"){if(!lastLoaded)screenContent+="?FILE NOT FOUND ERROR\nREADY.\n";else if(lastLoaded==="ARCADE")screenContent+="ARCADE DIRECTORY -- COMING SOON\nREADY.\n";else{screenContent+=`BOOTING ${lastLoaded}...\n`;render();setTimeout(()=>location.href=PROJECTS[lastLoaded],800);return;}}else{const m=cmd.match(/^LOAD\s+["']?([A-Z0-9]+)["']?(?:\s*,\s*8\s*,\s*1)?$/);const name=m?m[1]:(Object.prototype.hasOwnProperty.call(PROJECTS,cmd)?cmd:null);if(!name)screenContent+="?SYNTAX ERROR\nREADY.\n";else if(!PROJECTS[name])screenContent+="?FILE NOT FOUND ERROR\nREADY.\n";else{lastLoaded=name;screenContent+="SEARCHING\nLOADING\nREADY.\n";}}render();}
    const keyMap=new Map();for(let r=0;r<4;r++){const row=document.createElement("div");row.className="key-row";for(let c=0;c<15;c++){const key=document.createElement("div");key.className="key";row.appendChild(key);}keyboardOverlay.appendChild(row);}const codes=["F1","F3","F5","F7","F2","F4","F6","F8","","Digit1","KeyQ","KeyA","KeyZ","ShiftLeft","ShiftRight","Digit3","KeyW","KeyS","KeyX","Digit4","KeyE","KeyD","KeyC","Digit5","KeyR","KeyF","KeyV","Digit6","KeyT","KeyG","KeyB","KeyY","KeyH","KeyN","Digit7","KeyU","KeyJ","KeyM","Digit8","KeyI","KeyK","Comma","Digit9","KeyO","KeyL","Period","Digit0","KeyP","Slash","Minus","Equal","Backquote","BracketLeft","BracketRight","Backslash","Semicolon","Quote","Enter","Space","Backspace"];Array.from(keyboardOverlay.querySelectorAll(".key")).forEach((el,i)=>{if(codes[i])keyMap.set(codes[i],el);});
    function press(code){const el=keyMap.get(code);if(!el)return;el.classList.add("pressed");setTimeout(()=>el.classList.remove("pressed"),120);}
    document.addEventListener("keydown",e=>{press(e.code);if(!ready)return;if(e.key==="Enter"){e.preventDefault();command();}else if(e.key==="Backspace"){e.preventDefault();inputBuffer=inputBuffer.slice(0,-1);render();}else if(e.key.length===1&&!e.ctrlKey&&!e.metaKey&&!e.altKey){inputBuffer+=e.key.toUpperCase();render();}});
    screenOverlay.addEventListener("click",()=>{if(!ready)return;const text=prompt("LOAD PROGRAM: PAREIDOLIA, JESSEOS, CCTV, OR ARCADE");if(!text)return;inputBuffer=text;command();if(lastLoaded&&lastLoaded!=="ARCADE")setTimeout(()=>location.href=PROJECTS[lastLoaded],250);});
    setTimeout(boot,400);
  </script>
</body>
</html>
