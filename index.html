<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05070b">
<title>Tallkidd — Commodore 64</title>
<style>
@font-face{font-family:C64Pro;src:url('https://raw.githubusercontent.com/tallkidd23/JesseOS/main/C64_Pro-STYLE.woff2') format('woff2');font-display:swap}
:root{--blue:#416fb5;--bright:#5685cf;--glow:rgba(44,88,157,.48)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#05070b}body{min-height:100vh;display:grid;place-items:center;overflow-x:hidden}
.scene{position:relative;width:min(100vw,1024px);aspect-ratio:1;background:url('assets/C64.PNG') center/contain no-repeat}
.crt{position:absolute;left:47.3%;top:41.95%;width:20.7%;height:18.55%;padding:1.05% 1.15%;overflow:hidden;isolation:isolate;cursor:text;color:var(--blue);font-family:C64Pro,'Courier New',monospace;font-size:clamp(6px,.94vw,10px);line-height:1.19;white-space:pre-wrap;text-shadow:0 0 2px var(--glow);border-radius:9% 9% 11% 11%/7% 7% 9% 9%}
.crt:before{content:'';position:absolute;inset:0;z-index:-1;pointer-events:none;background:repeating-linear-gradient(to bottom,rgba(13,39,98,.07) 0,rgba(13,39,98,.07) 1px,transparent 1px,transparent 3px)}
.terminal{height:100%;display:flex;flex-direction:column;overflow:hidden}.output{flex:1;overflow:hidden;white-space:pre-wrap}.command{flex:none;color:var(--bright);min-height:1.2em}.cursor{display:inline-block;width:.67em;height:1.03em;vertical-align:-.13em;background:var(--bright);animation:blink 1s steps(1,end) infinite}@keyframes blink{50%{opacity:0}}
.mobile-input{position:absolute;opacity:0;width:1px;height:1px;left:0;top:0;border:0}
.keys{position:absolute;left:30%;top:71.15%;width:39.7%;height:7.7%;display:grid;grid-template-rows:repeat(4,1fr);gap:4%;padding:.2% .5%;pointer-events:none}.key-row{display:grid;grid-template-columns:repeat(15,1fr);gap:1.8%}.key{border-radius:18%;transition:background .055s,transform .055s}.key.down{background:rgba(255,255,255,.38);box-shadow:inset 0 1px 3px rgba(0,0,0,.7);transform:translateY(1px)}
.carved{position:absolute;left:18%;top:95.2%;width:64%;height:2.6%;color:rgba(29,14,7,.88);font-family:Georgia,'Times New Roman',serif;font-size:clamp(7px,1.05vw,12px);font-weight:900;line-height:1;text-align:center;letter-spacing:.045em;transform:perspective(300px) rotateX(2deg) rotateZ(-.25deg);pointer-events:none;white-space:nowrap;filter:contrast(1.24)}
.carved span{display:inline-block;position:relative;padding:.16em .42em .08em;background:rgba(96,51,23,.13);text-shadow:-1.5px -1.2px 0 rgba(9,4,2,.88),1px 1px 0 rgba(229,165,91,.62),0 2px 2px rgba(14,5,2,.5);clip-path:polygon(0 12%,3% 4%,7% 10%,11% 2%,15% 8%,19% 1%,23% 7%,27% 3%,31% 9%,35% 1%,39% 8%,43% 2%,47% 9%,51% 1%,55% 8%,59% 2%,63% 9%,67% 1%,71% 8%,75% 3%,79% 9%,83% 1%,87% 8%,91% 2%,95% 9%,100% 4%,98% 90%,94% 96%,90% 89%,86% 98%,82% 91%,78% 97%,74% 90%,70% 98%,66% 91%,62% 97%,58% 90%,54% 98%,50% 91%,46% 97%,42% 90%,38% 98%,34% 91%,30% 97%,26% 90%,22% 98%,18% 91%,14% 97%,10% 90%,6% 98%,2% 92%)}
.carved span:before{content:'';position:absolute;left:2%;right:2%;top:2px;height:2px;background:rgba(231,174,104,.38);box-shadow:0 3px 2px rgba(15,6,2,.55);transform:skewX(-8deg)}
@media(max-width:700px){body{place-items:start center}.scene{width:100vw;margin-top:5vh}.crt{font-size:clamp(6px,2.25vw,10px)}.carved{top:95.2%;font-size:clamp(5px,1.95vw,8px)}.keys{display:none}}
</style>
</head>
<body>
<main class="scene" aria-label="Interactive Commodore 64 desk">
<section class="crt" id="crt" aria-label="Commodore 64 terminal" tabindex="0"><div class="terminal"><div class="output" id="output"></div><div class="command"><span id="command"></span><span class="cursor" aria-hidden="true"></span></div></div><input id="mobileInput" class="mobile-input" autocomplete="off" autocapitalize="characters" spellcheck="false" inputmode="text" aria-label="C64 command input"></section>
<div class="keys" id="keys" aria-hidden="true"></div>
<div class="carved" aria-hidden="true"><span>TAP SCREEN · LOAD "NAME",8,1 · RUN</span></div>
</main>
<script>
const programs={PAREIDOLIA:'https://pareidolia.tallkidd.com',JESSEOS:'https://jesseos.tallkidd.com',CCTV:'https://cctv.tallkidd.com',ARCADE:null};
const crt=document.getElementById('crt'),out=document.getElementById('output'),command=document.getElementById('command'),mobile=document.getElementById('mobileInput'),keys=document.getElementById('keys');let history=[],buffer='',loaded=null,ready=false;
function draw(){out.textContent=history.join('\n');command.textContent=ready?buffer:''}
function line(text=''){history.push(text);if(history.length>22)history=history.slice(-22);draw()}
function boot(){const intro=['','**** COMMODORE 64 BASIC V2 ****','','64K RAM SYSTEM 38911 BASIC BYTES FREE','','READY.',''];let n=0;const next=()=>{if(n<intro.length){line(intro[n++]);setTimeout(next,175)}else{ready=true;line('TYPE LOAD "NAME",8,1');line('PAREIDOLIA  JESSEOS  CCTV  ARCADE');line('');draw()}};next()}
function press(code){const el=document.querySelector(`[data-code="${code}"]`);if(!el)return;el.classList.add('down');setTimeout(()=>el.classList.remove('down'),100)}
function execute(){const raw=buffer,cmd=raw.trim().toUpperCase();line(raw);buffer='';if(!cmd){line('READY.');return}if(cmd==='RUN'){if(!loaded){line('?FILE NOT FOUND ERROR');line('READY.');return}if(loaded==='ARCADE'){line('ARCADE DIRECTORY');line('COMING SOON.');line('READY.');return}line('BOOTING '+loaded+'...');line('READY.');setTimeout(()=>location.assign(programs[loaded]),700);return}const official=cmd.match(/^LOAD\s+["']?([A-Z0-9]+)["']?(?:\s*,\s*8\s*,\s*1)?$/);const casual=cmd.match(/^([A-Z0-9]+)(?:\s+LOAD\s*,?\s*8\s*,?\s*1)?$/);const name=official?official[1]:(casual?casual[1]:null);if(!name){line('?SYNTAX ERROR');line('READY.');return}if(!(name in programs)){line('?FILE NOT FOUND ERROR');line('READY.');return}loaded=name;line('SEARCHING FOR '+name);line('LOADING');line('READY.')}
function keydown(e){press(e.code);if(!ready)return;if(e.key==='Enter'){e.preventDefault();execute()}else if(e.key==='Backspace'){e.preventDefault();buffer=buffer.slice(0,-1);draw()}else if(e.key.length===1&&!e.metaKey&&!e.ctrlKey&&!e.altKey){e.preventDefault();buffer+=e.key.toUpperCase();draw()}}
document.addEventListener('keydown',keydown);crt.addEventListener('click',()=>mobile.focus());mobile.addEventListener('input',()=>{for(const c of mobile.value)if(c.length)buffer+=c.toUpperCase();mobile.value='';draw()});mobile.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();execute()}else if(e.key==='Backspace'&&!mobile.value){e.preventDefault();buffer=buffer.slice(0,-1);draw()}});
const codes=['F1','F3','F5','F7','F2','F4','F6','F8','Escape','Digit1','Digit2','Digit3','Digit4','Digit5','Backspace','KeyQ','KeyW','KeyE','KeyR','KeyT','KeyY','KeyU','KeyI','KeyO','KeyP','BracketLeft','BracketRight','Enter','KeyA','KeyS','KeyD','KeyF','KeyG','KeyH','KeyJ','KeyK','KeyL','Semicolon','Quote','ShiftLeft','KeyZ','KeyX','KeyC','KeyV','KeyB','KeyN','KeyM','Comma','Period','Slash','ShiftRight','Space','Space','Space','Space','Space','Space'];for(let r=0;r<4;r++){const row=document.createElement('div');row.className='key-row';for(let c=0;c<15;c++){const key=document.createElement('i');key.className='key';key.dataset.code=codes[r*15+c]||'';row.appendChild(key)}keys.appendChild(row)}
boot();
</script>
</body>
</html>
