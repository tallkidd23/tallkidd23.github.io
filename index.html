<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05070b">
<title>Tallkidd — Commodore 64</title>

<style>
@font-face {
  font-family: C64Pro;
  src: url("https://raw.githubusercontent.com/tallkidd23/JesseOS/main/C64_Pro-STYLE.woff2") format("woff2");
  font-display: swap;
}

@font-face {
  font-family: KrazyNights;
  src: url("assets/KRAZYNIGHTS.TTF") format("truetype");
  font-display: swap;
}

:root {
  --c64-blue: #2a4a7f;
  --c64-glow: rgba(44, 88, 157, 0.34);
}

* { box-sizing: border-box; }

html,
body {
  margin: 0;
  min-height: 100%;
  background: #05070b;
}

body {
  min-height: 100vh;
  display: grid;
  place-items: center;
  overflow-x: hidden;
}

.scene {
  position: relative;
  width: min(100vw, 1024px);
  aspect-ratio: 1;
  background: url("assets/C64.PNG") center / contain no-repeat;
}

/* CRT reduced by 0.5% on each side from the previous overlay. */
.crt {
  position: absolute;
  left: 41.225%;
  top: 41.95%;
  width: 27.2%;
  height: 18.55%;
  padding: 1.05% 1.15%;
  overflow: hidden;
  isolation: isolate;
  cursor: text;
  color: var(--c64-blue);
  font-family: C64Pro, "Courier New", monospace;
  font-size: clamp(3px, 0.47vw, 5px);
  line-height: 1.19;
  white-space: pre-wrap;
  text-shadow: 0 0 1px var(--c64-glow);
  border-radius: 9% 9% 11% 11% / 7% 7% 9% 9%;
}

.crt::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  background: repeating-linear-gradient(
    to bottom,
    rgba(13, 39, 98, 0.06) 0,
    rgba(13, 39, 98, 0.06) 1px,
    transparent 1px,
    transparent 3px
  );
}

.terminal {
  height: 100%;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.output,
.command {
  color: var(--c64-blue);
  font-family: inherit;
  font-size: inherit;
  line-height: inherit;
}

.output {
  flex: 1;
  overflow-y: auto;
  overscroll-behavior: contain;
  scrollbar-width: none;
  white-space: pre-wrap;
}

.output::-webkit-scrollbar { display: none; }

.command {
  flex: none;
  min-height: 1.19em;
}

.cursor {
  display: inline-block;
  width: 0.67em;
  height: 1.03em;
  vertical-align: -0.13em;
  background: var(--c64-blue);
  animation: blink 1s steps(1, end) infinite;
}

@keyframes blink {
  50% { opacity: 0; }
}

.mobile-input {
  position: absolute;
  opacity: 0;
  width: 1px;
  height: 1px;
  left: 0;
  top: 0;
  border: 0;
}

.keys {
  position: absolute;
  left: 30%;
  top: 71.15%;
  width: 39.7%;
  height: 7.7%;
  display: grid;
  grid-template-rows: repeat(4, 1fr);
  gap: 4%;
  padding: 0.2% 0.5%;
  pointer-events: none;
}

.key-row {
  display: grid;
  grid-template-columns: repeat(15, 1fr);
  gap: 1.8%;
}

.key {
  border-radius: 18%;
  transition: background 0.055s, transform 0.055s;
}

.key.down {
  background: rgba(255, 255, 255, 0.38);
  box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.7);
  transform: translateY(1px);
}

.carved {
  position: absolute;
  left: 18%;
  top: 95.9%;
  width: 64%;
  height: 3%;
  color: rgba(78, 45, 18, 0.86);
  font-family: KrazyNights, Georgia, serif;
  font-size: clamp(14px, 1.9vw, 22px);
  font-weight: 400;
  line-height: 1;
  text-align: center;
  letter-spacing: 0.025em;
  transform: perspective(260px) rotateX(5deg) rotateZ(-0.35deg);
  pointer-events: none;
  white-space: nowrap;
  filter: contrast(1.1);
}

.carved span {
  display: inline-block;
  position: relative;
  padding: 0.08em 0.36em 0.05em;
  text-shadow:
    -0.8px -0.7px 0 rgba(35, 16, 7, 0.55),
    0.75px 0.8px 0 rgba(242, 184, 108, 0.48),
    0 1.5px 1.5px rgba(28, 12, 5, 0.28);
}

.carved span::after {
  content: "";
  position: absolute;
  left: 4%;
  right: 4%;
  bottom: -1px;
  height: 1px;
  background: rgba(255, 205, 128, 0.35);
  box-shadow: 0 -1px 1px rgba(35, 14, 6, 0.22);
  opacity: 0.85;
}

@media (max-width: 700px) {
  body { place-items: start center; }
  .scene { width: 100vw; margin-top: 5vh; }
  .crt { font-size: clamp(3px, 1.12vw, 5px); }
  .carved { top: 95.9%; font-size: clamp(12px, 3.6vw, 18px); }
  .keys { display: none; }
}
</style>
</head>

<body>
<main class="scene" aria-label="Interactive Commodore 64 desk">
  <section class="crt" id="crt" aria-label="Commodore 64 terminal" tabindex="0">
    <div class="terminal">
      <div class="output" id="output"></div>
      <div class="command">
        <span id="command"></span><span class="cursor" aria-hidden="true"></span>
      </div>
    </div>

    <input
      id="mobileInput"
      class="mobile-input"
      autocomplete="off"
      autocapitalize="characters"
      spellcheck="false"
      inputmode="text"
      enterkeyhint="done"
      aria-label="C64 command input"
    >
  </section>

  <div class="keys" id="keys" aria-hidden="true"></div>

  <div class="carved" aria-hidden="true">
    <span>TAP SCREEN · LOAD "NAME",8,1 · RUN</span>
  </div>
</main>

<script>
const programs = {
  PAREIDOLIA: "https://pareidolia.tallkidd.com",
  JESSEOS: "https://jesseos.tallkidd.com",
  CCTV: "https://cctv.tallkidd.com",
  ARCADE: null
};

const crt = document.getElementById("crt");
const out = document.getElementById("output");
const command = document.getElementById("command");
const mobile = document.getElementById("mobileInput");
const keys = document.getElementById("keys");

let buffer = "";
let loaded = null;
let ready = false;

function scrollLog() {
  out.scrollTop = out.scrollHeight;
}

function draw() {
  command.textContent = ready ? buffer : "";
  requestAnimationFrame(scrollLog);
}

function line(text = "") {
  out.textContent += (out.textContent ? "\n" : "") + text;
  draw();
}

function boot() {
  const intro = [
    "",
    "**** COMMODORE 64 BASIC V2 ****",
    "",
    "64K RAM SYSTEM 38911 BASIC BYTES FREE",
    "",
    "READY.",
    ""
  ];

  let n = 0;
  const next = () => {
    if (n < intro.length) {
      line(intro[n++]);
      setTimeout(next, 175);
    } else {
      ready = true;
      line("READY.");
      draw();
    }
  };
  next();
}

function press(code) {
  const key = document.querySelector(`[data-code="${code}"]`);
  if (!key) return;
  key.classList.add("down");
  setTimeout(() => key.classList.remove("down"), 100);
}

function addCharacters(text) {
  for (const char of text) {
    if (char && char !== "\n" && char !== "\r") buffer += char.toUpperCase();
  }
  draw();
}

function loadProgram(name) {
  if (!(name in programs)) {
    line("?FILE NOT FOUND ERROR");
    line("READY.");
    return;
  }

  loaded = name;
  line("SEARCHING FOR " + name);
  line("LOADING");
  line("READY.");
}

function execute() {
  if (!ready) return;

  const raw = buffer;
  const cmd = raw.trim().toUpperCase();
  line(raw);
  buffer = "";

  if (!cmd) {
    line("READY.");
    return;
  }

  if (cmd === "RUN") {
    if (!loaded) {
      line("?FILE NOT FOUND ERROR");
      line("READY.");
      return;
    }

    if (loaded === "ARCADE") {
      line("ARCADE DIRECTORY");
      line("COMING SOON.");
      line("READY.");
      return;
    }

    line("BOOTING " + loaded + "...");
    setTimeout(() => location.assign(programs[loaded]), 700);
    return;
  }

  const official = cmd.match(
    /^LOAD\s+["']?([A-Z0-9]+)["']?\s*(?:,\s*8\s*(?:,\s*1)?)?$/
  );
  const casual = cmd.match(
    /^([A-Z0-9]+)(?:\s+LOAD\s*,?\s*8\s*(?:,\s*1)?)?$/
  );
  const name = official ? official[1] : casual ? casual[1] : null;

  if (!name) {
    line("?SYNTAX ERROR");
    line("READY.");
    return;
  }

  loadProgram(name);
}

document.addEventListener("keydown", (event) => {
  press(event.code);
  if (!ready || event.target === mobile) return;

  if (event.key === "Enter") {
    event.preventDefault();
    execute();
  } else if (event.key === "Backspace") {
    event.preventDefault();
    buffer = buffer.slice(0, -1);
    draw();
  } else if (
    event.key.length === 1 &&
    !event.metaKey && !event.ctrlKey && !event.altKey
  ) {
    event.preventDefault();
    addCharacters(event.key);
  }
});

crt.addEventListener("click", () => mobile.focus());

mobile.addEventListener("beforeinput", (event) => {
  if (!ready) return;
  if (event.inputType === "deleteContentBackward") {
    event.preventDefault();
    buffer = buffer.slice(0, -1);
    draw();
  }
});

mobile.addEventListener("input", () => {
  if (mobile.value) {
    addCharacters(mobile.value);
    mobile.value = "";
  }
});

mobile.addEventListener("keydown", (event) => {
  if (event.key === "Enter") {
    event.preventDefault();
    execute();
  }
});

const codes = [
  "F1", "F3", "F5", "F7", "F2", "F4", "F6", "F8", "Escape", "Digit1", "Digit2", "Digit3", "Digit4", "Digit5", "Backspace",
  "KeyQ", "KeyW", "KeyE", "KeyR", "KeyT", "KeyY", "KeyU", "KeyI", "KeyO", "KeyP", "BracketLeft", "BracketRight", "Enter", "KeyA", "KeyS",
  "KeyD", "KeyF", "KeyG", "KeyH", "KeyJ", "KeyK", "KeyL", "Semicolon", "Quote", "ShiftLeft", "KeyZ", "KeyX", "KeyC", "KeyV", "KeyB",
  "KeyN", "KeyM", "Comma", "Period", "Slash", "ShiftRight", "Space", "Space", "Space", "Space", "Space", "Space"
];

for (let rowNumber = 0; rowNumber < 4; rowNumber++) {
  const row = document.createElement("div");
  row.className = "key-row";
  for (let column = 0; column < 15; column++) {
    const key = document.createElement("i");
    key.className = "key";
    key.dataset.code = codes[rowNumber * 15 + column] || "";
    row.appendChild(key);
  }
  keys.appendChild(row);
}

boot();
</script>
</body>
</html>
